<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #d4ffd4; }
    #login-page, #chat-page { display: none; height: 100vh; }
    #login-page.active, #chat-page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    input, button { padding: 10px; margin: 5px; font-size: 16px; }

    #messages {
      flex-grow: 1; padding: 10px; overflow-y: auto;
      width: 100%; max-height: 60vh; background-color: #e0ffe0;
    }

    .message {
      background: white; margin: 5px; padding: 10px;
      border-radius: 10px; max-width: 80%;
    }

    #input-area {
      display: flex; flex-wrap: wrap; padding: 10px;
      background: #f0f0f0; width: 100%;
    }

    #message-input {
      flex: 1; font-size: 16px;
    }

    .file-label {
      cursor: pointer; margin-left: 10px;
    }

    audio, video, img {
      max-width: 200px;
      display: block;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<!-- Login page -->
<div id="login-page" class="active">
  <h2>Guruhga Kirish</h2>
  <input type="text" id="login" placeholder="Login (masalan: bolla)" />
  <input type="password" id="code" placeholder="Kod (masalan: 02-sinf)" />
  <button onclick="checkLogin()">Kirish</button>
  <p id="login-error" style="color:red;"></p>
</div>

<!-- Chat page -->
<div id="chat-page">
  <h3 id="group-title"></h3>
  <div id="messages"></div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Xabar yozing..." />
    <button onclick="sendMessage()">📨</button>

    <!-- Smayliklar -->
    <button onclick="addEmoji('😊')">😊</button>
    <button onclick="addEmoji('😂')">😂</button>
    <button onclick="addEmoji('🎉')">🎉</button>

    <!-- Audio -->
    <button id="recordBtn">🎤 Start</button>

    <!-- Fayl yuklash -->
    <label class="file-label">📎
      <input type="file" id="fileInput" hidden accept="image/*,video/*" onchange="handleFile(event)">
    </label>
  </div>
</div>

<script>
  const validGroups = ["umumiy", "qizlar", "bolla", "coder"];
  const groupCode = "02-sinf";
  let currentGroup = "";
  let mediaRecorder, chunks = [];

  function checkLogin() {
    const login = document.getElementById("login").value.trim().toLowerCase();
    const code = document.getElementById("code").value.trim();

    if (validGroups.includes(login) && code === groupCode) {
      currentGroup = login;
      document.getElementById("login-page").classList.remove("active");
      document.getElementById("chat-page").classList.add("active");
      document.getElementById("group-title").textContent = `Guruh: ${currentGroup}`;
      loadMessages();
    } else {
      document.getElementById("login-error").textContent = "Login yoki kod noto‘g‘ri!";
    }
  }

  function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    const msgDiv = createMessageElement({ type: "text", content: text });
    document.getElementById("messages").appendChild(msgDiv);

    saveMessageToGroup(currentGroup, { type: "text", content: text });
    input.value = "";
  }

  function addEmoji(emoji) {
    document.getElementById("message-input").value += emoji;
  }

  function saveMessageToGroup(group, msgObj) {
    let stored = JSON.parse(localStorage.getItem("messages_" + group)) || [];
    stored.push(msgObj);
    localStorage.setItem("messages_" + group, JSON.stringify(stored));
  }

  function loadMessages() {
    const container = document.getElementById("messages");
    container.innerHTML = "";
    const stored = JSON.parse(localStorage.getItem("messages_" + currentGroup)) || [];
    stored.forEach((msg) => {
      const div = createMessageElement(msg);
      container.appendChild(div);
    });
  }

  function createMessageElement(msg) {
    const div = document.createElement("div");
    div.className = "message";

    if (msg.type === "text") {
      div.textContent = msg.content;
    } else if (msg.type === "image") {
      const img = document.createElement("img");
      img.src = msg.content;
      div.appendChild(img);
    } else if (msg.type === "video") {
      const video = document.createElement("video");
      video.controls = true;
      video.src = msg.content;
      div.appendChild(video);
    } else if (msg.type === "audio") {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = msg.content;
      div.appendChild(audio);
    }

    return div;
  }

  function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const fileUrl = e.target.result;
      const type = file.type.startsWith("image") ? "image" : "video";

      const div = createMessageElement({ type, content: fileUrl });
      document.getElementById("messages").appendChild(div);
      saveMessageToGroup(currentGroup, { type, content: fileUrl });
    };
    reader.readAsDataURL(file);
  }

  // Audio recording
  document.getElementById("recordBtn").onclick = async () => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.start();
      chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);
        const msg = { type: "audio", content: url };
        document.getElementById("messages").appendChild(createMessageElement(msg));
        saveMessageToGroup(currentGroup, msg);
      };
      document.getElementById("recordBtn").textContent = "⏹️ Stop";
    } else {
      mediaRecorder.stop();
      document.getElementById("recordBtn").textContent = "🎤 Start";
    }
  };
</script>

</body>
</html>
